name: Deploy UI to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel in-progress if a new push arrives
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate config.js
        run: |
          echo "window.SUPABASE_URL='${{ secrets.SUPABASE_URL }}';" > ui/config.js
          echo "window.SUPABASE_KEY='${{ secrets.SUPABASE_KEY }}';" >> ui/config.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ui/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
