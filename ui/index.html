<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeting Search</title>
  <!-- Pico CSS: classless, semantic HTML styling -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <!-- Alpine.js: reactive UI -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="shared.css">
  <style>
    /* Limit table from overflowing on small screens */
    table { table-layout: fixed; word-break: break-word; }

    /* Search result cards for utterances */
    .utterance-result {
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--pico-border-color);
    }
    .utterance-result:last-child { border-bottom: none; }

    /* Pagination controls */
    .pagination {
      display: flex;
      align-items: center;
      gap: 1rem;
      justify-content: center;
      margin-top: 1rem;
    }

    /* Keep the latest meeting card from getting too wide */
    .latest-meeting { max-width: 640px; }

    /* Badge on semantic-only results */
    .semantic-badge {
      font-style: italic;
      opacity: 0.6;
    }

    /* Compact result rows inside a single card */
    .result-row {
      padding: 0.4rem 0;
      border-bottom: 1px solid var(--pico-border-color);
    }
    .result-row:last-child { border-bottom: none; }
    .result-row-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.5rem;
    }
    .result-row-summary {
      font-size: 0.85rem;
      opacity: 0.65;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      margin: 0.1rem 0 0;
    }
    .meeting-summary-link {
      display: block;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .nav-actions {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      justify-content: flex-end;
    }
    .hidden-file-input {
      display: none;
    }
    .help-button {
      width: 2.25rem;
      min-width: 2.25rem;
      padding-left: 0;
      padding-right: 0;
      border-radius: 50%;
      text-align: center;
    }
    .upload-button {
      min-width: 6.5rem;
    }
    .upload-status {
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }
    .upload-errors {
      margin-top: 0.5rem;
      max-height: 10rem;
      overflow: auto;
    }
    .filter-chips {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin: -0.5rem 0 1rem;
    }
    .filter-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      width: auto;
      margin: 0;
      padding: 0.2rem 0.55rem;
      font-size: 0.85rem;
      line-height: 1.4;
    }
    .filter-chip span:last-child {
      font-weight: 700;
    }
    @media (max-width: 640px) {
      .nav-actions {
        gap: 0.4rem;
      }
    }
  </style>
</head>
<body>
  <main class="container" x-data="searchApp()" x-init="init()">

    <!-- ── Header ── -->
    <header>
      <nav>
        <ul><li><strong>Meeting Search</strong></li></ul>
        <ul>
          <li class="nav-actions">
            <input
              x-ref="uploadInput"
              class="hidden-file-input"
              type="file"
              accept=".csv,text/csv"
              @change="selectUploadFile($event)"
              :disabled="uploading"
              aria-label="Meetings CSV file"
            >
            <button class="upload-button" @click="openUploadPicker()" :disabled="uploading">
              <span x-show="!uploading">Upload</span>
              <span x-show="uploading" aria-busy="true">Uploading</span>
            </button>
            <button class="secondary outline help-button" @click="showUploadHelp()" aria-label="Upload help">?</button>
          </li>
        </ul>
      </nav>
    </header>

    <!-- ── Search bar ── -->
    <input
      type="search"
      placeholder="Search meeting summaries and transcripts…"
      x-model="query"
      @input.debounce.350ms="onSearch()"
      aria-label="Search"
    >
    <div class="filter-chips" x-show="dateFilter || searchCorrections.length > 0">
      <button
        class="secondary outline filter-chip"
        x-show="dateFilter"
        @click="removeDateFilter()"
        type="button"
        aria-label="Remove date filter"
      >
        <span x-text="'Date: ' + (dateFilter?.label || '')"></span>
        <span aria-hidden="true">×</span>
      </button>
      <template x-for="correction in searchCorrections" :key="correction.term">
        <button
          class="secondary outline filter-chip"
          @click="applySearchCorrection(correction.term)"
          type="button"
          x-text="correction.term"
        ></button>
      </template>
    </div>

    <dialog x-ref="uploadHelpDialog">
      <article>
        <header>
          <button aria-label="Close" rel="prev" @click="closeUploadHelp()"></button>
          <strong>Upload help</strong>
        </header>
        <p>Ask Simon for more info</p>
      </article>
    </dialog>

    <!-- ── Loading / error states ── -->
    <p x-show="loading" aria-busy="true">Loading…</p>
    <p x-show="error" style="color: var(--pico-del-color)">
      Error: <span x-text="error"></span>
      <br><small>Check the browser console (F12) for details. Make sure you're serving this page over HTTP, not opening it as a file://.</small>
    </p>
    <p class="upload-status" x-show="uploadMessage" x-text="uploadMessage"></p>
    <template x-if="uploadFailures.length > 0">
      <article class="upload-errors">
        <strong x-text="uploadFailures.length + ' failed row' + (uploadFailures.length === 1 ? '' : 's')"></strong>
        <ul>
          <template x-for="failure in uploadFailures.slice(0, 10)" :key="failure.row">
            <li x-text="'Row ' + failure.row + ': ' + failure.message"></li>
          </template>
        </ul>
        <small x-show="uploadFailures.length > 10" x-text="'Showing first 10 of ' + uploadFailures.length + ' failures.'"></small>
      </article>
    </template>

    <!-- ══════════════════════════════════════════════
         DEFAULT VIEW (no active search query)
    ═══════════════════════════════════════════════ -->
    <template x-if="!query.trim() && !loading">

      <div>
        <!-- Most recent meeting preview card -->
        <h2>Most Recent Meeting</h2>
        <template x-if="latestMeeting">
          <article>
            <header>
              <strong x-text="latestMeeting.meeting_name || 'Untitled Meeting'"></strong>
              &nbsp;·&nbsp;
              <small x-text="formatDate(latestMeeting.date)"></small>
            </header>
            <p x-text="latestMeeting.short_summary"></p>
            <footer>
              <a :href="'meeting.html?id=' + encodeURIComponent(latestMeeting.meeting_id)" role="button">
                View meeting →
              </a>
            </footer>
          </article>
        </template>
        <template x-if="!latestMeeting">
          <p><em>No meetings found.</em></p>
        </template>

        <!-- All meetings table (paginated) -->
        <h2>All Meetings</h2>
        <figure>
          <table>
            <thead>
              <tr>
                <th style="width: 30%">Date</th>
                <th>Summary</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="meeting in allMeetings" :key="meeting.meeting_id">
                <tr>
                  <td x-text="formatDate(meeting.date)"></td>
                  <td>
                    <a
                      class="meeting-summary-link"
                      :href="'meeting.html?id=' + encodeURIComponent(meeting.meeting_id)"
                      :title="meeting.short_summary || 'No summary available'"
                      x-text="meeting.short_summary || 'No summary available'"
                    ></a>
                  </td>
                </tr>
              </template>
              <template x-if="allMeetings.length === 0">
                <tr><td colspan="2"><em>No meetings yet.</em></td></tr>
              </template>
            </tbody>
          </table>
        </figure>

        <!-- Pagination -->
        <div class="pagination">
          <button @click="prevPage()" :disabled="page === 1" class="outline">‹ Prev</button>
          <span x-text="'Page ' + page + ' of ' + (totalPages || 1)"></span>
          <button @click="nextPage()" :disabled="page >= totalPages" class="outline">Next ›</button>
        </div>

      </div>
    </template>

    <!-- ══════════════════════════════════════════════
         SEARCH RESULTS VIEW
    ═══════════════════════════════════════════════ -->
    <template x-if="query.trim() && !loading">
      <div>

        <!-- Meeting result rows -->
        <h2>Meeting Results
          <small x-show="meetingResults.length > 0" x-text="'(' + meetingResults.length + ')'"></small>
        </h2>
        <template x-if="meetingResults.length === 0">
          <p><em>No matching meeting summaries.</em></p>
        </template>
        <template x-if="meetingResults.length > 0">
          <article>
            <template x-for="m in visibleMeetingResults" :key="m.meeting_id">
              <div class="result-row">
                <div class="result-row-meta">
                  <a :href="'meeting.html?id=' + encodeURIComponent(m.meeting_id)">
                    <strong x-text="m.meeting_name || 'Untitled'"></strong>
                  </a>
                  <small x-text="formatDate(m.date)"></small>
                </div>
                <p class="result-row-summary" x-text="m.short_summary || 'No summary available'"></p>
              </div>
            </template>
            <footer x-show="!showAllMeetingResults && meetingResults.length > RESULT_PREVIEW_LIMIT">
              <button class="secondary outline" type="button" @click="showAllMeetingResults = true">
                <span x-text="'Show more (' + (meetingResults.length - RESULT_PREVIEW_LIMIT) + ')'"></span>
              </button>
            </footer>
          </article>
        </template>

        <!-- Transcript mention results -->
        <h2>Transcript Mentions
          <small x-show="utteranceResults.length > 0" x-text="'(' + utteranceResults.length + ')'"></small>
        </h2>
        <template x-if="utteranceResults.length === 0">
          <p><em>No matching transcript excerpts.</em></p>
        </template>
        <template x-if="utteranceResults.length > 0">
          <div>
            <template x-for="group in visibleGroupedUtterances" :key="group.meeting_id">
              <article>
                <header>
                  <a :href="'meeting.html?id=' + encodeURIComponent(group.meeting_id)">
                    <strong x-text="group.meeting_name || group.meeting_id"></strong>
                  </a>
                  &nbsp;·&nbsp;
                  <small x-text="formatDate(group.date)"></small>
                </header>
                <p style="font-size: 0.875rem; opacity: 0.7; margin: 0.1rem 0 0.5rem;" x-text="group.short_summary"></p>
                <template x-for="u in (expandedGroups[group.meeting_id] ? group.utterances : group.utterances.slice(0, 3))" :key="u.id">
                  <div class="utterance-result">
                    <span class="avatar" :style="'background:' + speakerColor(u.speaker)" x-text="speakerInitial(u.speaker)"></span>
                    <div>
                      <strong x-text="u.speaker"></strong>
                      &nbsp;·&nbsp;
                      <small x-text="formatTime(u.start_time)"></small>
                      <p x-text="u.text" style="margin-top: 0.25rem; margin-bottom: 0;"></p>
                    </div>
                  </div>
                </template>
                <template x-if="group.utterances.length > 3">
                  <p style="margin: 0.25rem 0 0; text-align: right;">
                    <a href="#" @click.prevent="toggleGroup(group.meeting_id)" style="font-size: 0.85rem;">
                      <span x-text="expandedGroups[group.meeting_id] ? 'Show less' : 'Show ' + (group.utterances.length - 3) + ' more…'"></span>
                    </a>
                  </p>
                </template>
              </article>
            </template>
            <button
              class="secondary outline"
              x-show="!showAllTranscriptResults && groupedUtterances.length > RESULT_PREVIEW_LIMIT"
              type="button"
              @click="showAllTranscriptResults = true"
            >
              <span x-text="'Show more (' + (groupedUtterances.length - RESULT_PREVIEW_LIMIT) + ')'"></span>
            </button>
          </div>
        </template>

        <!-- ── Also related (semantic) ── -->
        <!-- Visible while semantic search is in-flight or once results arrive.
             Hidden entirely if semantic found nothing after loading. -->
        <template x-if="semanticLoading || semanticMeetingResults.length > 0">
          <div>
            <hr>
            <h2>
              Also related
              <small x-show="semanticLoading" aria-busy="true"> · finding similar…</small>
              <small x-show="!semanticLoading && semanticMeetingResults.length > 0"
                     x-text="'(' + semanticMeetingResults.length + ')'"></small>
            </h2>
            <p x-show="semanticLoading && semanticMeetingResults.length === 0" aria-busy="true">
              Searching semantically…
            </p>
            <article x-show="semanticMeetingResults.length > 0">
              <template x-for="m in semanticMeetingResults" :key="m.meeting_id">
                <div class="result-row">
                  <div class="result-row-meta">
                    <a :href="'meeting.html?id=' + encodeURIComponent(m.meeting_id)">
                      <strong x-text="m.meeting_name || 'Untitled'"></strong>
                      &nbsp;<small class="semantic-badge">~ similar</small>
                    </a>
                    <small x-text="formatDate(m.date)"></small>
                  </div>
                  <p class="result-row-summary" x-text="m.short_summary"></p>
                </div>
              </template>
            </article>
          </div>
        </template>

      </div>
    </template>

  </main>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="shared.js"></script>
  <script>
    // ── Page size for the meetings table ────────────────────────────────────
    const PAGE_SIZE = 10
    const RESULT_PREVIEW_LIMIT = 5

    // ── Alpine component ─────────────────────────────────────────────────────
    function searchApp() {
      return {
        query: '',
        loading: false,

        // Default view state
        latestMeeting: null,
        allMeetings: [],
        page: 1,
        totalCount: 0,

        // CSV upload state
        uploadFile: null,
        uploading: false,
        uploadMessage: '',
        uploadFailures: [],

        // Transcript search results
        meetingResults: [],
        utteranceResults: [],
        showAllMeetingResults: false,
        showAllTranscriptResults: false,
        dateFilter: null,
        searchCorrections: [],

        // Semantic search results (loaded in parallel with transcript search)
        semanticMeetingResults: [],
        semanticLoading: false,

        // Tracks which utterance groups are expanded beyond the first 3 (meeting_id → bool)
        expandedGroups: {},

        // Incremented on each new search so stale async results are discarded
        _searchGen: 0,

        // Error message
        error: null,

        // ── Initialise: load the default view data ──────────────────────────
        async init() {
          this.loading = true
          this.error = null
          try {
            await Promise.all([
              this.loadLatestMeeting(),
              this.loadMeetings(),
            ])
          } catch (e) {
            console.error('Failed to load meetings:', e)
            this.error = e.message || String(e)
          } finally {
            this.loading = false
          }
        },

        // ── Load the most recent meeting for the preview card ───────────────
        async loadLatestMeeting() {
          const { data, error } = await db
            .from('meetings')
            .select('*')
            .order('date', { ascending: false })
            .limit(1)
            .maybeSingle()
          if (error) throw new Error('loadLatestMeeting: ' + error.message)
          this.latestMeeting = data
        },

        // ── Load one page of meetings for the table ─────────────────────────
        async loadMeetings() {
          const from = (this.page - 1) * PAGE_SIZE
          const to = from + PAGE_SIZE - 1
          const { data, count, error } = await db
            .from('meetings')
            .select('meeting_id, short_summary, date', { count: 'exact' })
            .order('date', { ascending: false })
            .range(from, to)
          if (error) throw new Error('loadMeetings: ' + error.message)
          this.allMeetings = data || []
          this.totalCount = count || 0
        },

        // Group utteranceResults by meeting, sorted by meeting date desc;
        // utterances within each group sorted by start_time asc.
        get groupedUtterances() {
          const groups = {}
          for (const u of this.utteranceResults) {
            if (!groups[u.meeting_id]) {
              groups[u.meeting_id] = { meeting_id: u.meeting_id, meeting_name: u.meeting_name, short_summary: u.short_summary, date: u.date, utterances: [] }
            }
            groups[u.meeting_id].utterances.push(u)
          }
          for (const g of Object.values(groups)) {
            g.utterances.sort((a, b) => (a.start_time || 0) - (b.start_time || 0))
          }
          return Object.values(groups).sort((a, b) => new Date(b.date) - new Date(a.date))
        },

        get visibleMeetingResults() {
          return this.showAllMeetingResults ? this.meetingResults : this.meetingResults.slice(0, RESULT_PREVIEW_LIMIT)
        },

        get visibleGroupedUtterances() {
          return this.showAllTranscriptResults ? this.groupedUtterances : this.groupedUtterances.slice(0, RESULT_PREVIEW_LIMIT)
        },

        get totalPages() {
          return Math.max(1, Math.ceil(this.totalCount / PAGE_SIZE))
        },

        async prevPage() {
          if (this.page > 1) {
            this.page--
            this.loading = true
            await this.loadMeetings()
            this.loading = false
          }
        },

        async nextPage() {
          if (this.page < this.totalPages) {
            this.page++
            this.loading = true
            await this.loadMeetings()
            this.loading = false
          }
        },

        openUploadPicker() {
          if (this.uploading) return
          this.$refs.uploadInput.value = ''
          this.$refs.uploadInput.click()
        },

        showUploadHelp() {
          this.$refs.uploadHelpDialog.showModal()
        },

        closeUploadHelp() {
          this.$refs.uploadHelpDialog.close()
        },

        selectUploadFile(event) {
          this.uploadFile = event.target.files?.[0] || null
          this.uploadFailures = []
          this.uploadMessage = this.uploadFile ? `Ready to upload ${this.uploadFile.name}` : ''
          if (this.uploadFile) this.uploadCsv()
        },

        async uploadCsv() {
          if (!this.uploadFile || this.uploading) return

          this.uploading = true
          this.error = null
          this.uploadFailures = []
          this.uploadMessage = `Reading ${this.uploadFile.name}...`

          try {
            const text = await this.uploadFile.text()
            const records = parseMeetingsCsv(text)
            if (records.length === 0) {
              this.uploadMessage = 'No meeting rows found.'
              return
            }

            let uploaded = 0
            let skipped = 0
            let failed = 0

            for (let index = 0; index < records.length; index++) {
              const record = records[index]
              this.uploadMessage = `Uploading ${index + 1} of ${records.length}...`
              const result = await db.uploadArchive({
                meeting_id: record.meeting_id,
                summary: ensureHexPrefix(record.summary),
                transcript: ensureHexPrefix(record.transcript),
              })

              if (result.ok && result.skipped) {
                skipped++
              } else if (result.ok) {
                uploaded++
              } else {
                failed++
                this.uploadFailures.push({
                  row: record.row,
                  message: result.message || 'Upload failed',
                })
              }
            }

            this.uploadMessage = `Done: ${uploaded} uploaded, ${skipped} skipped, ${failed} failed.`
            await Promise.all([
              this.loadLatestMeeting(),
              this.loadMeetings(),
            ])
          } catch (e) {
            console.error('CSV upload failed:', e)
            this.uploadMessage = ''
            this.error = e.message || String(e)
          } finally {
            this.uploading = false
          }
        },

        // ── Search: called on debounced input ───────────────────────────────
        async onSearch() {
          // When query is cleared, reset everything and return to default view
          if (!this.query.trim()) {
            this.utteranceResults = []
            this.meetingResults = []
            this.showAllMeetingResults = false
            this.showAllTranscriptResults = false
            this.dateFilter = null
            this.searchCorrections = []
            this.semanticMeetingResults = []
            this.semanticLoading = false
            this.expandedGroups = {}
            return
          }

          // Stamp this search so any older in-flight semantic calls are discarded
          this._searchGen++
          const gen = this._searchGen

          this.loading = true
          this.semanticLoading = true
          this.error = null
          this.meetingResults = []
          this.utteranceResults = []
          this.showAllMeetingResults = false
          this.showAllTranscriptResults = false
          this.dateFilter = null
          this.searchCorrections = []
          this.semanticMeetingResults = []

          // Fire semantic search independently — it will resolve later without
          // blocking the transcript results from appearing.
          this._runSemantic(this.query, gen)

          // Keyword searches (fast — no embedding call)
          try {
            const [parseResp, meetingResp, utteranceResp] = await Promise.all([
              db.rpc('parse_search_query', { query: this.query }),
              db.rpc('search_meetings', { query: this.query }),
              db.rpc('search_utterances', { query: this.query }),
            ])
            if (parseResp.error) throw new Error('parse_search_query: ' + parseResp.error.message)
            if (meetingResp.error) throw new Error('search_meetings: ' + meetingResp.error.message)
            if (utteranceResp.error) throw new Error('search_utterances: ' + utteranceResp.error.message)
            if (gen === this._searchGen) {
              const meetingResults = meetingResp.data || []
              const utteranceResults = utteranceResp.data || []
              this.dateFilter = parseResp.data?.dateFilter || null
              this.meetingResults = meetingResults
              this.utteranceResults = utteranceResults

              const correctionResp = await db.rpc('suggest_search_corrections', { query: this.query, limit: 5 })
              if (gen !== this._searchGen) return
              if (correctionResp.error) {
                console.warn('Search correction failed (non-fatal):', correctionResp.error.message)
              } else {
                this.searchCorrections = correctionResp.data || []
              }
            }
          } catch (e) {
            console.error('Transcript search failed:', e)
            if (gen === this._searchGen) this.error = e.message || String(e)
          } finally {
            if (gen === this._searchGen) this.loading = false
          }
        },

        // ── Semantic search: runs in parallel with keyword, resolves later ──
        // Uses search_meetings_semantic (short_summary embeddings).
        // De-duplicates against meetingResults so the "Also related" section
        // only shows meetings not already found by keyword search.
        async _runSemantic(query, gen) {
          try {
            const resp = await db.rpc('search_meetings_semantic', { query, match_count: 5 })
            if (gen !== this._searchGen) return  // stale — a newer search is in progress
            if (resp.error) throw new Error(resp.error.message)
            this.semanticMeetingResults = resp.data || []
          } catch (e) {
            // Semantic failure is non-fatal: log it but don't surface to user
            console.warn('Semantic search failed (non-fatal):', e)
          } finally {
            if (gen === this._searchGen) this.semanticLoading = false
          }
        },

        toggleGroup(id) {
          this.expandedGroups[id] = !this.expandedGroups[id]
        },

        removeDateFilter() {
          if (!this.dateFilter) return
          const phrase = this.dateFilter.phrase || ''
          this.query = phrase
            ? this.query
                .replace(phrase, ' ')
                .replace(/\b(?:on|in|during)\s*$/i, '')
                .replace(/\s+/g, ' ')
                .trim()
            : this.query
          this.dateFilter = null
          this.onSearch()
        },

        applySearchCorrection(term) {
          this.query = term
          this.searchCorrections = []
          this.onSearch()
        },

        // ── Helpers ─────────────────────────────────────────────────────────
        formatDate(dateStr) {
          if (!dateStr) return '—'
          return new Date(dateStr).toLocaleDateString('en-US', {
            year: 'numeric', month: 'short', day: 'numeric',
          })
        },
        formatTime,
        speakerInitial,
        speakerColor,
      }
    }

    function ensureHexPrefix(value) {
      return value.startsWith('\\x') ? value : `\\x${value}`
    }

    function parseMeetingsCsv(text) {
      const rows = parseCsv(text)
      if (rows.length === 0) return []

      const header = rows[0].map((value) => value.trim())
      const required = ['meeting_id', 'summary', 'transcript', 'creation_time']
      for (let index = 0; index < required.length; index++) {
        if (header[index] !== required[index]) {
          throw new Error(`CSV header must start with: ${required.join(', ')}`)
        }
      }

      const records = []
      for (let index = 1; index < rows.length; index++) {
        const row = rows[index]
        if (row.every((value) => !value.trim())) continue

        const record = {
          row: index + 1,
          meeting_id: (row[0] || '').trim(),
          summary: (row[1] || '').trim(),
          transcript: (row[2] || '').trim(),
        }
        if (!record.meeting_id) throw new Error(`Row ${record.row}: meeting_id is required`)
        if (!record.summary) throw new Error(`Row ${record.row}: summary is required`)
        if (!record.transcript) throw new Error(`Row ${record.row}: transcript is required`)
        records.push(record)
      }
      return records
    }

    function parseCsv(text) {
      const rows = []
      let row = []
      let field = ''
      let inQuotes = false

      for (let index = 0; index < text.length; index++) {
        const char = text[index]
        const next = text[index + 1]

        if (inQuotes) {
          if (char === '"' && next === '"') {
            field += '"'
            index++
          } else if (char === '"') {
            inQuotes = false
          } else {
            field += char
          }
          continue
        }

        if (char === '"') {
          inQuotes = true
        } else if (char === ',') {
          row.push(field)
          field = ''
        } else if (char === '\n') {
          row.push(field)
          rows.push(row)
          row = []
          field = ''
        } else if (char !== '\r') {
          field += char
        }
      }

      if (inQuotes) throw new Error('CSV contains an unterminated quoted field')
      if (field || row.length > 0) {
        row.push(field)
        rows.push(row)
      }
      return rows
    }
  </script>
